<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Delete stock item</title>
    <style>
        body {
            margin: 0;
            padding: 3rem 1rem;
            background: #f5f7fa;
            color: #172536;
            font-family: system-ui, sans-serif;
        }

        .confirmation {
            max-width: 32rem;
            margin: 0 auto;
            padding: clamp(1.25rem, 5vw, 2rem);
            background: white;
            border: 1px solid #dce3eb;
            border-top: 4px solid #0f1f3d;
            border-radius: 1rem;
            box-shadow: 0 8px 24px rgb(15 31 61 / 10%);
        }

        h1 {
            margin: 0 0 0.75rem;
            font-size: 1.75rem;
        }

        .item-details {
            margin: 1.25rem 0;
            padding: 1rem;
            background: #edf2f8;
            border-radius: 0.625rem;
            overflow-wrap: anywhere;
        }

        .item-details strong {
            display: block;
            margin-bottom: 0.25rem;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            margin-top: 1.5rem;
        }

        .actions a,
        .actions button {
            padding: 0.75rem 1rem;
            border: 1px solid transparent;
            border-radius: 0.5rem;
            font: inherit;
            font-weight: 600;
            text-decoration: none;
        }

        .actions a {
            border-color: #c8d2df;
            color: #172536;
        }

        .actions a:hover {
            background: #edf2f8;
        }

        .actions button {
            background: #b42318;
            color: white;
            cursor: pointer;
        }

        .actions button:hover {
            background: #8f1c13;
        }

        .actions :focus-visible {
            outline: 3px solid #174c63;
            outline-offset: 3px;
        }
    </style>
</head>
<body>
    <main class="confirmation">
        <h1>Delete stock item?</h1>
        <p>This will permanently remove the item from inventory.</p>

        <div class="item-details">
            <strong>{{ item.name }}</strong>
            <span>SKU {{ item.sku }}</span>
        </div>

        <form class="actions" method="post" action="{% url 'stock_delete' item.pk %}">
            {% csrf_token %}
            <a href="{% url 'stock_list' %}">Cancel</a>
            <button type="submit">Delete item</button>
        </form>
    </main>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Inventory Dashboard</title>
    <style>
        body {
            margin: 0;
            background: #f5f7fa;
            color: #172536;
            font-family: system-ui, sans-serif;
        }

        .dashboard {
            display: grid;
            grid-template-columns: 230px minmax(0, 1fr);
            min-height: 100vh;
        }

        .sidebar {
            padding: 1.5rem 1.25rem;
            background: #0f1f3d;
            color: white;
        }

        .brand {
            margin: 0 0 1.5rem;
            font-size: 1.125rem;
            font-weight: 700;
        }

        .sidebar a {
            display: block;
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            background: #174c63;
            color: white;
            text-decoration: none;
        }

        .sidebar a:hover {
            background: #215d76;
        }

        .sidebar a:focus-visible {
            outline: 3px solid #7dd3fc;
            outline-offset: 3px;
        }

        main {
            padding: clamp(1rem, 4vw, 3rem);
        }

        h1 {
            margin: 0 0 1.25rem;
            font-size: clamp(1.75rem, 4vw, 2.5rem);
        }

        .table-wrapper {
            overflow-x: auto;
            border: 1px solid #dce3eb;
            border-radius: 0.75rem;
            background: white;
            box-shadow: 0 8px 24px rgb(15 31 61 / 8%);
        }

        table {
            width: 100%;
            min-width: 30rem;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 0.85rem 1rem;
            border-bottom: 1px solid #dce3eb;
            text-align: left;
        }

        th {
            background: #e8eef6;
            font-weight: 600;
        }

        th:nth-child(n+3),
        td:nth-child(n+3) {
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        tbody tr:last-child td {
            border-bottom: 0;
        }

        td[colspan] {
            text-align: center;
        }

        @media (max-width: 700px) {
            .dashboard {
                grid-template-columns: minmax(0, 1fr);
                grid-template-rows: auto 1fr;
            }

            .sidebar {
                padding: 1rem;
            }

            .brand {
                margin-bottom: 0.75rem;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <aside class="sidebar">
            <p class="brand">Secure Stock Management</p>
            <nav aria-label="Main navigation">
                <a href="{% url 'stock_list' %}" aria-current="page">Inventory</a>
            </nav>
        </aside>

        <main>
            <h1>Inventory Dashboard</h1>

            <div class="table-wrapper" role="region"
                 aria-label="Stock items table" tabindex="0">
                <table aria-label="Stock items">
                    <thead>
                        <tr>
                            <th scope="col">Name</th>
                            <th scope="col">SKU</th>
                            <th scope="col">Quantity</th>
                            <th scope="col">Reorder level</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for item in items %}
                        <tr>
                            <td>{{ item.name }}</td>
                            <td>{{ item.sku }}</td>
                            <td>{{ item.quantity }}</td>
                            <td>{{ item.reorder_level }}</td>
                        </tr>
                        {% empty %}
                        <tr>
                            <td colspan="4">No stock items found.</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </main>
    </div>
</body>
</html>
